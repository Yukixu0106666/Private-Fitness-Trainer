services:
  - type: web
    name: fitness-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MODEL_INPUT_COST_PER_1M
        sync: false
      - key: MODEL_OUTPUT_COST_PER_1M
        sync: false
      - key: EMBEDDING_COST_PER_1M
        sync: false
      - key: COOKIE_SECURE
        value: "true"
